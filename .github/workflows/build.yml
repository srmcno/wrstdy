name: Build single-file artifact

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build single-file bundle
        env:
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL }}
        run: npm run build:single

      - name: Build chunked bundle
        env:
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL }}
        run: npm run build

      # The Power Apps code component's application bundle. Building it here
      # catches a break in the PCF entry point (or the map stub aliasing) on
      # the same push, rather than the next time somebody runs pac pcf push.
      # The .NET solution build is intentionally not run in CI — it needs the
      # Power Platform MSBuild targets and a publisher that matches the
      # environment, both of which belong to the deploying admin.
      - name: Build Power Apps component bundle
        run: npm run build:pcf

      - name: Upload single-file HTML
        uses: actions/upload-artifact@v4
        with:
          name: water-rate-study-tool-single-file
          path: dist-single/index.html
          if-no-files-found: error

      - name: Upload chunked dist
        uses: actions/upload-artifact@v4
        with:
          name: water-rate-study-tool-dist
          path: dist/
          if-no-files-found: error

      - name: Upload Power Apps component bundle
        uses: actions/upload-artifact@v4
        with:
          name: water-rate-study-tool-pcf-app-bundle
          path: pcf/WaterRateStudyTool/app/wrs-app.js
          if-no-files-found: error
